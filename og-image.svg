<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2185b"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="733" cy="261" r="85" fill="#e91e63" opacity="0.10"/>
    <circle cx="328" cy="521" r="26" fill="#e91e63" opacity="0.06"/>
    <circle cx="-3" cy="64" r="76" fill="#e91e63" opacity="0.15"/>
    <circle cx="401" cy="-27" r="70" fill="#e91e63" opacity="0.12"/>
    <circle cx="246" cy="478" r="56" fill="#e91e63" opacity="0.07"/>
    <circle cx="29" cy="-14" r="65" fill="#e91e63" opacity="0.09"/>
    <rect x="1173" y="328" width="32" height="27" rx="8" fill="#c2185b" opacity="0.14" transform="rotate(33, 676, 14)"/>
    <rect x="33" y="516" width="31" height="94" rx="8" fill="#c2185b" opacity="0.14" transform="rotate(8, 888, 684)"/>
    <rect x="885" y="515" width="40" height="76" rx="8" fill="#c2185b" opacity="0.15" transform="rotate(6, 1167, -22)"/>
    <rect x="35" y="93" width="96" height="40" rx="8" fill="#c2185b" opacity="0.04" transform="rotate(30, 652, 431)"/>
    <rect x="903" y="132" width="68" height="48" rx="8" fill="#c2185b" opacity="0.08" transform="rotate(36, 1200, 452)"/>
    <rect x="-41" y="361" width="96" height="62" rx="8" fill="#c2185b" opacity="0.04" transform="rotate(25, 419, -67)"/>
    <rect x="562" y="138" width="63" height="60" rx="8" fill="#c2185b" opacity="0.03" transform="rotate(1, 1093, 490)"/>
    <rect x="110" y="255" width="44" height="89" rx="8" fill="#c2185b" opacity="0.09" transform="rotate(42, 995, 10)"/>
    <polygon points="324,186 345,228 303,228" fill="#e91e63" opacity="0.06"/>
    <polygon points="197,236 285,412 109,412" fill="#e91e63" opacity="0.13"/>
    <polygon points="1199,81 1269,221 1129,221" fill="#e91e63" opacity="0.12"/>
    <polygon points="1120,478 1195,628 1045,628" fill="#e91e63" opacity="0.10"/>

  <!-- Wave at bottom -->
  <path d="M0,540 C360,585 840,495 1200,540 L1200,630 L0,630Z" fill="#e91e63" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    상암 코인노래방 후기
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    상암 — 코인노래방
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#fff3e0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#fff3e0" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    상암 상암 코인노래방 후기 — 코인노래방
  </text>
</svg>